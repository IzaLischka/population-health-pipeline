[project]
name = "population-health-pipeline"
version = "0.1.0"
description = "Population health data pipeline for chronic condition management: medallion architecture, batch and streaming, with multi-tenant analytics for hospitals and health plans."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests"]
